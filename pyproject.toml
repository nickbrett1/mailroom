[project]
name = "mailroom"
version = "0.1.0"
description = "Email → facts pipeline platform. Vertical #1: definitive PlayStation game catalog (owned_games store) from PSN + retailer receipts via msgvault, enriched with IGDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-webserver",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.4",
    "fastmcp>=3.0",  # catalog_mcp server tests (separate container at deploy)
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

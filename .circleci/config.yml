version: 2.1
orbs:
jobs:
  build:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout
      # Cache pip's package cache (portable across runners) instead of the
      # virtualenv: a cached .venv's python3 symlink points at a base
      # interpreter path that may not exist on the next runner, so restoring it
      # breaks the build (Error: .venv/bin/python3: No such file or directory).
      - restore_cache:
          keys:
            - v2-pip-{{ checksum "pyproject.toml" }}
            - v2-pip-
      - run:
          name: Install Packages
          command: |
            rm -rf .venv
            python3 -m venv .venv
            echo '. .venv/bin/activate' >> "$BASH_ENV"
            pip install --upgrade pip
            pip install -e ".[dev]"
      - save_cache:
          paths:
            - ~/.cache/pip
          key: v2-pip-{{ checksum "pyproject.toml" }}


      - run:
          name: Lint (Ruff)
          command: ruff check src tests
      - run:
          name: Test (pytest)
          command: pytest -v



  docker-publish:
    docker:
      - image: cimg/base:stable
    environment:
      # Registry-backed BuildKit caches: layers are pulled from GHCR on each
      # run and pushed back with mode=max, so only changed layers rebuild.
      MAILROOM_CACHE_REF: ghcr.io/nickbrett1/mailroom:buildcache
      CATALOG_MCP_CACHE_REF: ghcr.io/nickbrett1/catalog-mcp:buildcache
      DAGSTER_MCP_CACHE_REF: ghcr.io/nickbrett1/dagster-mcp:buildcache
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Login to Container Registry
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - run:
          name: Build and Push Image (mailroom)
          command: |
            docker buildx create --use --bootstrap || true
            docker buildx build --platform linux/amd64 \
              --cache-from type=registry,ref=$MAILROOM_CACHE_REF \
              --cache-to type=registry,ref=$MAILROOM_CACHE_REF,mode=max \
              -t ghcr.io/nickbrett1/mailroom:$CIRCLE_SHA1 -t ghcr.io/nickbrett1/mailroom:latest --push .
      - run:
          name: Set GHCR Package Visibility (public)
          command: |
            IMAGE="ghcr.io/nickbrett1/mailroom"
            PKG_NAME="$(basename "$IMAGE" | tr '[:upper:]' '[:lower:]')"
            echo "Setting GHCR package '$PKG_NAME' visibility to 'public'..."
            if ! curl -fsS -X PATCH \
                -H "Authorization: Bearer $GHCR_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user/packages/container/$PKG_NAME/visibility" \
                -d '{"visibility":"public"}' >/dev/null; then
              echo "User-scope call failed; retrying with org scope 'nickbrett1'..."
              curl -fsS -X PATCH \
                -H "Authorization: Bearer $GHCR_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/orgs/nickbrett1/packages/container/$PKG_NAME/visibility" \
                -d '{"visibility":"public"}' >/dev/null
            fi
      - run:
          name: Build and Push Image (catalog-mcp)
          command: |
            docker buildx create --use --bootstrap || true
            docker buildx build --platform linux/amd64 \
              --cache-from type=registry,ref=$CATALOG_MCP_CACHE_REF \
              --cache-to type=registry,ref=$CATALOG_MCP_CACHE_REF,mode=max \
              -t ghcr.io/nickbrett1/catalog-mcp:$CIRCLE_SHA1 -t ghcr.io/nickbrett1/catalog-mcp:latest --push catalog_mcp
      - run:
          name: Set GHCR Package Visibility (public)
          command: |
            IMAGE="ghcr.io/nickbrett1/catalog-mcp"
            PKG_NAME="$(basename "$IMAGE" | tr '[:upper:]' '[:lower:]')"
            echo "Setting GHCR package '$PKG_NAME' visibility to 'public'..."
            if ! curl -fsS -X PATCH \
                -H "Authorization: Bearer $GHCR_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user/packages/container/$PKG_NAME/visibility" \
                -d '{"visibility":"public"}' >/dev/null; then
              echo "User-scope call failed; retrying with org scope 'nickbrett1'..."
              curl -fsS -X PATCH \
                -H "Authorization: Bearer $GHCR_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/orgs/nickbrett1/packages/container/$PKG_NAME/visibility" \
                -d '{"visibility":"public"}' >/dev/null
            fi
      - run:
          name: Build and Push Image (dagster-mcp)
          command: |
            docker buildx create --use --bootstrap || true
            docker buildx build --platform linux/amd64 \
              --cache-from type=registry,ref=$DAGSTER_MCP_CACHE_REF \
              --cache-to type=registry,ref=$DAGSTER_MCP_CACHE_REF,mode=max \
              -t ghcr.io/nickbrett1/dagster-mcp:$CIRCLE_SHA1 -t ghcr.io/nickbrett1/dagster-mcp:latest --push dagster-mcp
      - run:
          name: Set GHCR Package Visibility (public)
          command: |
            IMAGE="ghcr.io/nickbrett1/dagster-mcp"
            PKG_NAME="$(basename "$IMAGE" | tr '[:upper:]' '[:lower:]')"
            echo "Setting GHCR package '$PKG_NAME' visibility to 'public'..."
            if ! curl -fsS -X PATCH \
                -H "Authorization: Bearer $GHCR_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user/packages/container/$PKG_NAME/visibility" \
                -d '{"visibility":"public"}' >/dev/null; then
              echo "User-scope call failed; retrying with org scope 'nickbrett1'..."
              curl -fsS -X PATCH \
                -H "Authorization: Bearer $GHCR_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/orgs/nickbrett1/packages/container/$PKG_NAME/visibility" \
                -d '{"visibility":"public"}' >/dev/null
            fi
workflows:
  build-and-test:
    jobs:
      - build:
          context: common


      - docker-publish:
          context: common
          requires:
            - build
          filters:
            branches:
              only: main

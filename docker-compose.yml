# Docker Compose configuration for mailroom
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/mailroom:latest
    container_name: mailroom
    restart: unless-stopped

    ports:
      - "3003:3003"
    volumes:
      - /volume1/docker/mailroom/data:/data
    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      MSGVAULT_URL: ${MSGVAULT_URL}
      MSGVAULT_TOKEN: ${MSGVAULT_TOKEN}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      PSN_CLIENT_ID: ${PSN_CLIENT_ID}
      PSN_CLIENT_SECRET: ${PSN_CLIENT_SECRET}
      DAGSTER_HOME: ${DAGSTER_HOME:-/data/dagster}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Services"
      - "homepage.name=mailroom"
      - "homepage.href=http://nas:3003/"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://localhost:3003/server_info"

  # Manual-edit API — the ONLY write path for UI-driven catalog edits
  # (same mailroom image; separate process; single-writer rule preserved).
  mailroom-manual:
    image: ghcr.io/nickbrett1/mailroom:latest
    container_name: mailroom-manual
    restart: unless-stopped
    command: ["uvicorn", "mailroom.manual_api:app", "--host", "0.0.0.0", "--port", "3004"]
    ports:
      - "3004:3004"
    volumes:
      - /volume1/docker/mailroom/data:/data
    environment:
      MAILROOM_DB_URL: ${MAILROOM_DB_URL:-sqlite:////data/mailroom.db}
      PSN_CLIENT_ID: ${PSN_CLIENT_ID}
      PSN_CLIENT_SECRET: ${PSN_CLIENT_SECRET}
    # The image HEALTHCHECK curls :3003; this process listens on :3004
    # (BUG-3 fix — compose-level override).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3004/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Services"
      - "homepage.name=mailroom-manual"
      - "homepage.href=http://nas:3004/health"

  # Read-only catalog MCP (FastMCP over the shared catalog_views store).
  # Published to GHCR by CI (ghcr.io/nickbrett1/catalog-mcp). The data volume
  # is mounted :rw because SQLite needs the -shm WAL index even for reads;
  # read-only-ness is enforced in-code via PRAGMA query_only=ON (BUG-2 fix).
  catalog-mcp:
    image: ghcr.io/nickbrett1/catalog-mcp:latest
    container_name: catalog-mcp
    restart: unless-stopped
    ports:
      - "8766:8766"
    volumes:
      - /volume1/docker/mailroom/data:/data
    environment:
      CATALOG_DB: ${CATALOG_DB:-/data/mailroom.db}
      CATALOG_PORT: ${CATALOG_PORT:-8766}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Services"
      - "homepage.name=catalog-mcp"
      - "homepage.href=http://nas:8766/"
